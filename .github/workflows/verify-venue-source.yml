name: Reproduce pinned venue binary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MeteoraAg/damm-v2
          ref: a85c926607433f23f0ea60f4ca7b1ae92f4156cb
          path: venue-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build in the digest-pinned Solana Foundation Linux image
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/venue-source:/build" \
            solanafoundation/solana-verifiable-build@sha256:f71be5ca7620b7e40933b7f1294fa44e01d08c1fc5ba1f375a2478f5a01580d3 \
            bash -c 'cd /; export RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | cut -d " " -f 1)"; cd /build/programs/cp-amm; cargo build-sbf -- --locked'
      - run: npm run solana:inspect-venue
      - run: node scripts/solana/verify-venue-build.mjs venue-source/target/deploy/cp_amm.so
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: venue-build-evidence
          path: |
            venue-verification.json
            venue-source/target/deploy/cp_amm.so
          retention-days: 14
