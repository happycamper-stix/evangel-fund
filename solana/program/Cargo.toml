[package]
name = "evangel-factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
test-fixtures = []
venue-adapter = []
venue-candidate = ["venue-adapter"]

[dependencies]
solana-program = "=5.1.0"
solana-system-interface = { version = "=3.3.0", features = ["wincode"] }
borsh = { version = "=1.5.7", features = ["derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
